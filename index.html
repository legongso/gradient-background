<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>예배 그래디언트 루프 배경</title>
<style>
  :root { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 하단 자막 가독성용 약한 어둠 */
  body::after { content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none; background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,.3)); }
  #ui {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; gap: 8px; padding: 8px; border-radius: 999px;
    background: rgba(0,0,0,.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    z-index: 2; transition: opacity .6s; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  #ui.hide { opacity: 0; pointer-events: none; }
  button {
    border: 0; color: #fff; background: transparent; cursor: pointer;
    padding: 10px 16px; border-radius: 999px; font-size: 14px; font-family: inherit; white-space: nowrap;
  }
  button.on { background: rgba(255,255,255,.25); }
  button:hover { background: rgba(255,255,255,.18); }
  @media (max-width: 520px) { button { padding: 9px 11px; font-size: 12.5px; } #ui { gap: 2px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button data-m="0" class="on">빠른 곡 · 밝게</button>
  <button data-m="1">중간 템포 · 적당</button>
  <button data-m="2">느린 곡 · 어둡게</button>
  <button id="fs">전체화면</button>
</div>
<script>
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16));
const MODES = [
  { speed: 1.0, base: '#f0502f', cols: ['#ff8a2b','#ff3d7f','#f2602f','#1fa3d9','#ffa63d'], alpha: .95 },
  { speed: .5, base: '#2342b8', cols: ['#2b7de0','#6a4bef','#1a9e96','#3f6fd8','#8a5cf0'], alpha: .85 },
  { speed: .2, base: '#070b1f', cols: ['#1a1f5c','#3b1e6e','#0f3a5f','#25134d','#12204a'], alpha: .9 }
].map(m => ({ ...m, base: hex(m.base), cols: m.cols.map(hex) }));

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, R;
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 1.5);
  W = cv.width = innerWidth * d; H = cv.height = innerHeight * d;
  R = Math.max(W, H) * .6;
}
addEventListener('resize', resize); resize();

// 현재 상태(전환 시 부드럽게 보간)
let cur = { speed: MODES[0].speed, alpha: MODES[0].alpha, base: [...MODES[0].base], cols: MODES[0].cols.map(c => [...c]) };
let tgt = MODES[0];
const lerp = (a, b, k) => a + (b - a) * k;

// 블롭 궤도: 정수 배 주파수의 sin/cos → 끊김 없는 무한 루프
const blobs = [
  { fx: 1, fy: 2, px: 0.0, py: 1.0, r: 1.0 },
  { fx: 2, fy: 1, px: 2.1, py: 0.4, r: .9 },
  { fx: 1, fy: 1, px: 4.0, py: 2.7, r: 1.1 },
  { fx: 3, fy: 2, px: 1.3, py: 5.1, r: .8 },
  { fx: 2, fy: 3, px: 3.4, py: 3.3, r: .95 }
];

let t = 0, last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now; 
  const k = 1 - Math.exp(-dt * 2.2);
  cur.speed = lerp(cur.speed, tgt.speed, k);
  cur.alpha = lerp(cur.alpha, tgt.alpha, k);
  for (let i = 0; i < 3; i++) cur.base[i] = lerp(cur.base[i], tgt.base[i], k);
  cur.cols.forEach((c, j) => { for (let i = 0; i < 3; i++) c[i] = lerp(c[i], tgt.cols[j][i], k); });
  t += dt * cur.speed * .35;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgb(${cur.base.map(Math.round)})`;
  ctx.fillRect(0, 0, W, H);

  blobs.forEach((b, j) => {
    const x = W / 2 + Math.sin(t * b.fx + b.px) * W * .42;
    const y = H / 2 + Math.cos(t * b.fy + b.py) * H * .42;
    const r = R * b.r * (1 + .12 * Math.sin(t * 2 + j));
    const c = cur.cols[j].map(Math.round).join(',');
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${c},${cur.alpha})`);
    g.addColorStop(1, `rgba(${c},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// 컨트롤
const ui = document.getElementById('ui');
let off = false; // H 키: UI 완전 숨김
const btns = [...document.querySelectorAll('button[data-m]')];
function setMode(i) {
  tgt = MODES[i];
  btns.forEach((b, j) => b.classList.toggle('on', i === j));
}
btns.forEach(b => b.onclick = () => setMode(+b.dataset.m));
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || (() => {})).call(document.documentElement);
}
document.getElementById('fs').onclick = toggleFS;
addEventListener('keydown', e => {
  if (e.key >= '1' && e.key <= '3') setMode(+e.key - 1);
  if (e.key.toLowerCase() === 'f') toggleFS();
  if (e.key.toLowerCase() === 'h') {
    off = !off;
    if (off) { ui.classList.add('hide'); document.body.style.cursor = 'none'; }
    else document.body.style.cursor = '';
  }
});

// UI 자동 숨김 (3초)
let timer;
function show() { if (off) return; ui.classList.remove('hide'); clearTimeout(timer); timer = setTimeout(() => ui.classList.add('hide'), 3000); }
['mousemove', 'touchstart', 'keydown', 'click'].forEach(ev => addEventListener(ev, show));
show();
</script>
</body>
</html>
